[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxmimic"
version = "0.2.0"
description = "Rewrite AI-generated text in your personal voice."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "numpy",
    "rich",
    "prompt_toolkit",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest"]

[project.scripts]
voxmimic = "voxmimic.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voxmimic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
