[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxmimic"
dynamic = ["version"]
description = "Rewrite AI-generated text in your own voice. Learns how you write, runs locally."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Thanniru Sai Teja"}]
keywords = ["writing", "style transfer", "paraphrase", "llm", "ollama", "cli", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "typer",
    "numpy",
    "rich",
    "prompt_toolkit",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/iam-saiteja/VoxMimic"
Issues = "https://github.com/iam-saiteja/VoxMimic/issues"
Changelog = "https://github.com/iam-saiteja/VoxMimic/blob/main/CHANGELOG.md"

[project.scripts]
voxmimic = "voxmimic.cli:main"

[tool.setuptools.dynamic]
version = {attr = "voxmimic.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["voxmimic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
